name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build the dev service
        run: DEV_UID="$(id -u)" DEV_GID="$(id -g)" docker compose build dev
      - name: Verify
        run: docker compose run --rm -T dev scripts/verify.sh
